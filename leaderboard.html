<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Bowl Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
        }

        .auto-refresh input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .leaderboard {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .leaderboard-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 20px;
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            gap: 15px;
            font-weight: 600;
            font-size: 1.1em;
        }

        .participant-row {
            padding: 20px;
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s;
        }

        .participant-row:hover {
            background: #f8f9fa;
        }

        .participant-row:last-child {
            border-bottom: none;
        }

        .rank {
            font-size: 1.5em;
            font-weight: 700;
            text-align: center;
        }

        .rank-1 { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .rank-2 { color: #C0C0C0; }
        .rank-3 { color: #CD7F32; }

        .participant-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .score {
            font-size: 1.5em;
            font-weight: 700;
            text-align: center;
            color: #11998e;
        }

        .picks-details {
            grid-column: 1 / -1;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
            display: none;
        }

        .participant-row.expanded .picks-details {
            display: block;
        }

        .pick-item {
            padding: 8px 0;
            display: grid;
            grid-template-columns: 200px 1fr 60px;
            gap: 15px;
            font-size: 0.95em;
        }

        .pick-category {
            font-weight: 600;
            color: #666;
        }

        .pick-value {
            color: #333;
        }

        .pick-correct {
            text-align: center;
        }

        .pick-correct.correct::after {
            content: "✓";
            color: #28a745;
            font-weight: bold;
            font-size: 1.2em;
        }

        .pick-correct.incorrect::after {
            content: "✗";
            color: #dc3545;
            font-weight: bold;
            font-size: 1.2em;
        }

        .expand-btn {
            background: none;
            border: none;
            color: #11998e;
            cursor: pointer;
            font-size: 0.9em;
            padding: 5px 10px;
            text-decoration: underline;
        }

        .expand-btn:hover {
            color: #0d7a6e;
        }

        .no-data {
            padding: 60px 20px;
            text-align: center;
            color: #666;
            font-size: 1.2em;
        }

        .last-updated {
            text-align: center;
            color: #666;
            padding: 15px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .leaderboard-header,
            .participant-row {
                grid-template-columns: 50px 1fr 80px;
                gap: 10px;
            }

            .pick-item {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Super Bowl LIX Leaderboard</h1>
            <p>Live Standings</p>
        </div>

        <div class="controls">
            <button class="refresh-btn" onclick="loadLeaderboard()">🔄 Refresh</button>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" checked>
                <label for="autoRefresh">Auto-refresh every 30 seconds</label>
            </div>
        </div>

        <div class="loading" id="loading">
            Loading leaderboard...
        </div>

        <div class="leaderboard" id="leaderboard" style="display: none;">
            <div class="leaderboard-header">
                <div>Rank</div>
                <div>Participant</div>
                <div>Score</div>
            </div>
            <div id="leaderboardContent"></div>
            <div class="last-updated" id="lastUpdated"></div>
        </div>

        <div class="no-data" id="noData" style="display: none;">
            <p>No participants yet. Share the form link to start collecting picks!</p>
        </div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_RDLcWzXddt8KE1xLDsfHg3wZgU_RqkYM_1QTmaPkmRiZdLDJk3T3UO_VW_jcAbo/exec';

        let autoRefreshInterval;

        async function loadLeaderboard() {
            const loading = document.getElementById('loading');
            const leaderboard = document.getElementById('leaderboard');
            const noData = document.getElementById('noData');
            const leaderboardContent = document.getElementById('leaderboardContent');

            loading.style.display = 'block';
            leaderboard.style.display = 'none';
            noData.style.display = 'none';

            try {
                const response = await fetch(SCRIPT_URL + '?action=getLeaderboard');
                const data = await response.json();

                loading.style.display = 'none';

                if (data.participants && data.participants.length > 0) {
                    leaderboard.style.display = 'block';
                    displayLeaderboard(data.participants, data.results);
                    updateLastUpdated();
                } else {
                    noData.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                loading.style.display = 'none';
                noData.innerHTML = '<p>Error loading leaderboard. Please refresh the page.</p>';
                noData.style.display = 'block';
            }
        }

        function displayLeaderboard(participants, results) {
            const content = document.getElementById('leaderboardContent');
            
            // Sort by score descending
            participants.sort((a, b) => b.score - a.score);

            let html = '';
            participants.forEach((participant, index) => {
                const rank = index + 1;
                const rankClass = rank <= 3 ? `rank-${rank}` : '';
                
                html += `
                    <div class="participant-row" id="row-${index}">
                        <div class="rank ${rankClass}">${rank}</div>
                        <div>
                            <div class="participant-name">${participant.name}</div>
                            <button class="expand-btn" onclick="toggleDetails(${index})">View Picks</button>
                        </div>
                        <div class="score">${participant.score}</div>
                        <div class="picks-details" id="details-${index}">
                            ${generatePicksHTML(participant.picks, results)}
                        </div>
                    </div>
                `;
            });

            content.innerHTML = html;
        }

        function generatePicksHTML(picks, results) {
            const categories = {
                'winner': 'Game Winner',
                'totalPoints': 'Total Points',
                'firstScore': 'First Team to Score',
                'mvp': 'MVP',
                'landmark': 'Bay Area Landmark',
                'anthem': 'National Anthem',
                'coinToss': 'Coin Toss',
                'defensiveTD': 'Defensive TD',
                'halftimeLength': 'Halftime Show',
                'gatorade': 'Gatorade Color'
            };

            let html = '';
            for (let [key, label] of Object.entries(categories)) {
                if (picks[key]) {
                    const isCorrect = results && results[key] === picks[key];
                    const correctClass = results && results[key] ? (isCorrect ? 'correct' : 'incorrect') : '';
                    
                    html += `
                        <div class="pick-item">
                            <div class="pick-category">${label}</div>
                            <div class="pick-value">${picks[key]}</div>
                            <div class="pick-correct ${correctClass}"></div>
                        </div>
                    `;
                }
            }
            return html;
        }

        function toggleDetails(index) {
            const row = document.getElementById(`row-${index}`);
            row.classList.toggle('expanded');
        }

        function updateLastUpdated() {
            const lastUpdated = document.getElementById('lastUpdated');
            const now = new Date().toLocaleTimeString();
            lastUpdated.textContent = `Last updated: ${now}`;
        }

        function setupAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    autoRefreshInterval = setInterval(loadLeaderboard, 30000); // 30 seconds
                } else {
                    clearInterval(autoRefreshInterval);
                }
            });

            // Start auto-refresh if checked
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(loadLeaderboard, 30000);
            }
        }

        // Load on page load
        window.addEventListener('load', function() {
            loadLeaderboard();
            setupAutoRefresh();
        });
    </script>
</body>
</html>
